name: Deploy to GitHub Pages

# Taiwan Forward — static deployment pipeline.
# Builds the static export (out/) and publishes it via the official
# GitHub Pages workflow. No secrets or tokens are required.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type checking
        run: bun run typecheck

      - name: Linting
        run: bun run lint

      - name: Build static export
        run: bun run build:static
        env:
          DEPLOY_TARGET: github-pages

      - name: Verify export output
        run: |
          test -f out/index.html || (echo "out/index.html missing" && exit 1)
          test -d out/_next || (echo "out/_next missing" && exit 1)
          echo "Static export verified:"
          find out -maxdepth 1 -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
